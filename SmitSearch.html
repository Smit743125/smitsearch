.ai{

    width: 100px;
    height: 40px;
    position: relative;
    background: rgba(255,255,255,0.08);
    border: none;
    border-radius: 20px;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    overflow: hidden;
    z-index: 1;
    backdrop-filter: blur(5px);
    transition: 0.5s;
}


/* RGB BORDER */
.ai::before{

    content: "";
    position: absolute;
    top: -2px;
    left: -2px;
    width: calc(100% + 4px);
    height: calc(100% + 4px);
    border-radius: 22px;

    background: linear-gradient(
        90deg,
        red,
        orange,
        yellow,
        lime,
        cyan,
        blue,
        violet,
        red
    );

    background-size: 300%;
    z-index: -2;
    animation: rgbMove 4s linear infinite;
}


/* INNER LAYER */
.ai::after{

    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: calc(100% - 4px);
    height: calc(100% - 4px);
    border-radius: 18px;
    background: rgba(15,15,15,0.85);
    z-index: -1;
}


.ai-container{

    position: fixed;
    bottom: 40px;
    right: 40px;
    display: flex;
    justify-content: center;
    align-items: center;
}


/* RGB MOVEMENT */
@keyframes rgbMove{

    0%{
        background-position: 0%;
    }
    100%{
        background-position: 300%;
    }
}

.moon{
    width: 120px;
    height: 120px;
    border-radius: 50%;
    position: absolute;

    #d9d9d9,

    opacity: 0;
}


@keyframes moonCycle {

    /* 🌞 hidden during day */
    0% {
        left: -10%;
        top: 80%;
        opacity: 0;
    }

    42% {
        opacity: 0;
    }

    /* 🌙 moonrise starts EARLIER */
    45% {
        left: -10%;
        top: 80%;
        opacity: 0;
    }

    /* 🌌 appears faster */
    50% {
        opacity: 1;
    }

    /* 🌕 reaches peak sooner */
    60% {
        left: 50%;
        top: 5%;
        opacity: 0.8;
    }

    /* 🌙 starts leaving earlier */
    72% {
         left: 72%;  /*72 */
        top: 5%;   /*25 */
        opacity: 0.6;
    }

    /* 🌌 fading before dawn */
    80% {
        left: 100%;  /*88 */
        top: 42%;   /*55 */
        opacity: 0.2;
    }

    /* 🌅 fully gone BEFORE morning */
    100% {
        left: 110%;
        top: 55%;
        opacity: 0;
    }
}



.sun{
    width: 150px;
    height: 150px;
    border-radius: 50%;
    box-shadow: 0 0 50px rgba(255, 221, 0, 20);

@keyframes sunCycle {

    /* 🌅 sunrise */
    0% {
        left: -10%;
        top: 90%;
        opacity: 0;
    }

    /* 🌞 appears smoothly */
    5% {
        opacity: 1;
    }

    /* ☀️ reaches center at 12s */
    20% {
        left: 50%;
        top: 5%;
        opacity: 0.7;
    }

    /* 🌇 keeps SAME SPEED downward */
    35% {
        left: 70%;
        top: 25%;
        opacity: 0.5;
    }

    /* 🌇 near sunset */
    45% {
        left: 85%;
        top: 55%;
        opacity: 0;
    }
    47% {
        opacity: 0;
    }
    /* 🌙 gone before night */
    50% {
        opacity: 0;
        left: 110%;
        top: 80%;
    }

    100% {
        opacity: 0;
    }

/* ================================= CLOCK ================================= */

function updateClock() {

    const now = new Date();

    let hours = now.getHours();

    const minutes = String(now.getMinutes()).padStart(2, '0');
    const seconds = String(now.getSeconds()).padStart(2, '0');

    const ampm = hours >= 12 ? 'OF Evening' : 'OF Morning';

    hours = hours % 12;
    hours = hours ? hours : 12;

    document.getElementById('clock').textContent =
    `${hours}:${minutes}:${seconds}`;

    document.getElementById('time-status').textContent =
    ampm;
}

setInterval(updateClock, 1000);
updateClock();


/* ================================= ENVIRONMENT ================================= */

function updateEnvironment() {

    const now = new Date();
    const hours = now.getHours();

    const sun = document.querySelector('.sun');
    const moon = document.querySelector('.moon');

    const morningDay = document.querySelector('.morning-day');
    const dayEvening = document.querySelector('.day-evening');
    const eveningNight = document.querySelector('.evening-night');
    const nightDeep = document.querySelector('.night-deep');
    const nightMorning = document.querySelector('.night-morning');

    /* RESET */
    sun.style.opacity = '0';
    moon.style.opacity = '0';

    morningDay.style.opacity = '0';
    dayEvening.style.opacity = '0';
    eveningNight.style.opacity = '0';
    nightDeep.style.opacity = '0';
    nightMorning.style.opacity = '0';

    /* 🌄 DAWN */
    if(hours >= 4 && hours < 6){
        nightMorning.style.opacity = '1';

        moon.style.opacity = '0.3';
        moon.style.left = '80%';
        moon.style.top = '15%';
    }

    /* 🌅 MORNING */
    else if(hours >= 6 && hours < 12){
        morningDay.style.opacity = '1';

        sun.style.opacity = '1';
        sun.style.left = '20%';
        sun.style.top = '20%';
    }

    /* ☀️ DAY */
    else if(hours >= 12 && hours < 17){
        dayEvening.style.opacity = '1';

        sun.style.opacity = '1';
        sun.style.left = '50%';
        sun.style.top = '5%';
    }

    /* 🌇 EVENING */
    else if(hours >= 17 && hours < 19){
        eveningNight.style.opacity = '1';

        sun.style.opacity = '1';
        sun.style.left = '80%';
        sun.style.top = '30%';
    }

    /* 🌙 NIGHT */
    else {
        nightDeep.style.opacity = '1';

        moon.style.opacity = '0.7';
        moon.style.left = '50%';
        moon.style.top = '10%';
    }
}

setInterval(updateEnvironment, 1000);
updateEnvironment();

/* ================= TYPING PLACEHOLDER EFFECT ================= */

const placeholders = [

    "Just Search it on Google...",
    "Wanna scroll reels? YouTube Here!...",
    "upload your project using GitHub...",
    "Ask ChatGPT...",
    "What's going on Instagram...",
    "Message on WhatsApp..."

];

const searchBox = document.getElementById("SearchBox");

let textIndex = 0;
let charIndex = 0;
let isDeleting = false;

function typeEffect() {

    let currentText = placeholders[textIndex];

    if(isDeleting){
        searchBox.placeholder =
        currentText.substring(0, charIndex--);

    }

    else {
        searchBox.placeholder =
        currentText.substring(0, charIndex++);
    }

    let speed = isDeleting ? 150 : 125;

    /* typing finished */
    if(!isDeleting && charIndex === currentText.length + 1){

        speed = 1500;
        isDeleting = true;
    }

    /* deleting finished */
    else if(isDeleting && charIndex === 0){

        isDeleting = false;
        textIndex++;
        if(textIndex >= placeholders.length){
            textIndex = 0;
        }

        speed = 400;
    }
    setTimeout(typeEffect, speed);
}

typeEffect();

async function getWeather() {

    const city = "Kolkata";

    const url =
    `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;

    const response = await fetch(url);

    const data = await response.json();

    console.log(data);

    if(data.main){

        document.getElementById("temp").textContent =
        Math.round(data.main.temp) + "°C";

        document.getElementById("city").textContent =
        data.name;

        document.getElementById("condition").textContent =
        data.weather[0].main;

    }

    else{

        console.log("API ERROR:", data.message);

    }
}

// ..........===============Night Particals====================.............

const particleContainer = document.querySelector(".particles"); // ✅ REQUIRED FIX

function createParticles(mode = "night") {

    particleContainer.innerHTML = ""; // important: prevents mixing

    for (let i = 0; i < 30; i++) {

        const p = document.createElement("div");
        p.classList.add("particle");

        // random size
        let size = Math.random() * 4 + 2;
        p.style.width = size + "px";
        p.style.height = size + "px";

        // random position
        p.style.top = Math.random() * 100 + "vh";

        if (mode === "day") {

            // p.classList.add("wind");

            p.style.left = "-10vw";
            p.style.animationDuration = (Math.random() * 5 + 4) + "s";

            // FIX: missing animation setup for wind (optional)
            p.style.animationName = "floatUp";
            p.style.animationTimingFunction = "linear";
            p.style.animationIterationCount = "infinite";

        } else {

            // night mode (your existing style)
            p.style.left = Math.random() * 100 + "vw";

            p.style.animation = "floatUp linear infinite";
            p.style.animationDuration = (Math.random() * 5 + 3) + "s";
        }

        particleContainer.appendChild(p); // ❗ WAS MISSING / COMMENTED BEFORE
    }
}


// IMPORTANT: actually start particles
